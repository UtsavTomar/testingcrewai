[project]
name = "my_project"
version = "0.1.0"
description = "Zendesk ticket analysis using crewAI"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=0.76.2",
]

[project.scripts]
my_project = "my_project.main:run"
run_crew = "my_project.main:run"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"